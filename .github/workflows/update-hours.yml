name: Update opening hours from Google

on:
  schedule:
    - cron: "0 16 * * *"   # 2am AEST / 3am AEDT, every night
  workflow_dispatch:

permissions:
  contents: write

jobs:
  hours:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch hours from Google Places
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: node scripts/fetch-hours.mjs

      - name: Commit if changed
        run: |
          if git diff --quiet -- hours.json; then
            echo "hours.json unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hours.json
          git commit -m "Update opening hours from Google"
          git push
